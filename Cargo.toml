[package]
name = "plain-browser"
version = "0.1.0"
edition = "2024"
description = "Plain Browser — 기본에 충실한 브라우저"
publish = false

[dependencies]
adblock = "0.13.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37.2"
url = "2"
wry = { version = "0.57.2", default-features = false, features = ["os-webview"] }
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_System_Com"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
