<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'">
  <title>시작 화면</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fcfdfb;color:#263c30;font:16px/1.8 "Segoe UI","Malgun Gothic",sans-serif;min-height:100vh;display:grid;place-items:center}main{max-width:700px;padding:48px 36px}.mark{height:48px;width:48px;border:2px solid #267459;border-radius:14px;display:grid;place-items:center;font-size:28px;font-weight:600;color:#267459}.label{font-size:12px;letter-spacing:2px;color:#63806d;margin-top:30px}h1{font-size:44px;letter-spacing:-1.5px;font-weight:650;line-height:1.2;margin:10px 0 20px}h1 span{color:#267459}p{color:#617565;margin:10px 0}.hint{margin-top:32px;padding:18px 22px;background:#f0f5ef;border-radius:12px;font-size:14px}.version{margin-top:32px;font-size:12px;color:#7d8a80}code{color:#267459}
    .mark{width:64px;height:64px;border:0;border-radius:0}.mark svg{display:block;width:100%;height:100%}
  </style>
</head>
<body>
  <main>
    <div class="mark" role="img" aria-label="Plain Browser PB"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="15" fill="#23755c"/><path fill="#fff" fill-rule="evenodd" d="M12 18h11c12 0 12 18 0 18h-5v10h-6zm6 6v6h5c4 0 4-6 0-6zM34 18h9c11 0 13 10 6 14 8 4 5 14-6 14h-9zm6 6v5h3c5 0 5-5 0-5zm0 11v5h4c5 0 5-5 0-5z"/></svg></div>
    <div class="label">PLAIN BROWSER</div>
    <h1>기본에 <span>충실하게.</span></h1>
    <p>웹의 내용을 빠르고 편하게 만나는 브라우저.<br>작고 단순한 첫걸음부터 시작합니다.</p>
    <div class="hint">위 주소창에 <code>example.com</code> 같은 웹 주소를 입력하고 Enter를 누르세요.</div>
    <p class="version">외부 광고 요청 차단 기본 적용 · 게시자의 본문과 같은 사이트 콘텐츠는 유지합니다.</p>
  </main>
</body>
</html>
